<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // Single Page Apps for GitHub Pages
    // https://github.com/rafgraph/spa-github-pages
    // Copyright (c) 2016 Rafael Pedicini, licensed under the MIT License
    // ----------------------------------------------------------------------
    // GitHub Pages 找不到子路径时会返回 404.html。这里把原始 path/query
    // 编码到 index.html 的查询串里，再跳回首页。index.html 里的脚本会再
    // 用 history.replaceState 把 URL 还原成原始路径，Vue Router 就能
    // 正常接管。
    //
    // pathSegmentsToKeep: 部署在子路径（如 username.github.io/repo/）时
    // 设为 1；部署在根（自定义域名或 username.github.io/）时设为 0。
    // ----------------------------------------------------------------------
    (function (l) {
      var pathSegmentsToKeep = 0;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    }(window.location));
  </script>
</head>
<body>
</body>
</html>
