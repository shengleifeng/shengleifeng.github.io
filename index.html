    <script>
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // ----------------------------------------------------------------------
      // 配对的反向脚本：检查 URL 是否带有 404.html 写入的 ?p=... / ?q=...。
      // 如果有，用 history.replaceState 把地址栏还原成访问者原本想去的路径，
      // 再让 Vue Router 正常初始化。必须放在 /src/main.js 之前。
      // ----------------------------------------------------------------------
      (function (l) {
        if (l.search) {
          var q = {};
          l.search.slice(1).split('&').forEach(function (v) {
            var a = v.split('=');
            q[a[0]] = a.slice(1).join('=');
          });
          if (q.p !== undefined) {
            window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + (q.p || '') +
              (q.q ? ('?' + q.q.replace(/~and~/g, '&')) : '') +
              l.hash
            );
          }
        }
      }(window.location));
    </script>
